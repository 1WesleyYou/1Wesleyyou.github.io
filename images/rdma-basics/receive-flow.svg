<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910" role="img" aria-labelledby="title desc">
<title id="title">SEND / RECV: receive-side flow</title><desc id="desc">Receiver B prepares a registered buffer before sender A sends a message. RC QP, no SRQ.</desc>
<defs><marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#18334c" stroke-width="1.6"/></marker><marker id="muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#526b80" stroke-width="1.6"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#3267ac" stroke-width="1.6"/></marker><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#147d78" stroke-width="1.6"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ad6221" stroke-width="1.6"/></marker><marker id="line" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#cbd7e1" stroke-width="1.6"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<style>text {font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill:#18334c;} .mono {font-family: 'SFMono-Regular', Menlo, monospace;}</style>
<text x="46" y="56" font-size="30" font-weight="700" text-anchor="start" class="" style="fill:#18334c">SEND / RECV: receive-side flow</text>
<text x="46" y="89" font-size="17" font-weight="400" text-anchor="start" class="" style="fill:#526b80">Receiver B prepares a registered buffer before sender A sends a message. RC QP, no SRQ.</text>
<rect x="50" y="146" width="320" height="94" rx="15" fill="#edf3fc" stroke="#3267ac" stroke-width="2"/><text x="210.0" y="189.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#3267ac">Application B</text><text x="210.0" y="217.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">prepare buffer and receive WR</text>
<rect x="480" y="146" width="320" height="94" rx="15" fill="#edf3fc" stroke="#3267ac" stroke-width="2"/><text x="640.0" y="189.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#3267ac">RQ</text><text x="640.0" y="217.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">receive work descriptors</text>
<rect x="925" y="146" width="305" height="94" rx="15" fill="#edf3fc" stroke="#3267ac" stroke-width="2"/><text x="1077.5" y="189.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#3267ac">RNIC B</text><text x="1077.5" y="217.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">incoming SEND from A</text>
<polyline points="370,193 480,193" fill="none" stroke="#3267ac" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="425" y="164" font-size="17" font-weight="400" text-anchor="middle" class="" style="fill:#3267ac">1. post</text>
<polyline points="800,193 925,193" fill="none" stroke="#3267ac" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="860" y="164" font-size="17" font-weight="400" text-anchor="middle" class="" style="fill:#3267ac">2. consume</text>
<rect x="925" y="332" width="305" height="108" rx="15" fill="#e9f6f1" stroke="#147d78" stroke-width="2"/><text x="1077.5" y="382.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#147d78">MR buffer</text><text x="1077.5" y="410.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">payload: 1 KiB in a 4 KiB buffer</text>
<polyline points="1080,240 1080,332" fill="none" stroke="#147d78" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="1100" y="284" font-size="17" font-weight="400" text-anchor="start" class="" style="fill:#147d78">3. DMA payload</text>
<rect x="480" y="332" width="320" height="108" rx="15" fill="#fff4e6" stroke="#ad6221" stroke-width="2"/><text x="640.0" y="382.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#ad6221">Receive CQ</text><text x="640.0" y="410.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">CQE: completion record</text>
<polyline points="973,240 973,284 640,284 640,332" fill="none" stroke="#ad6221" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="685" y="275" font-size="17" font-weight="400" text-anchor="start" class="" style="fill:#ad6221">4. publish completion</text>
<polyline points="480,380 370,380" fill="none" stroke="#3267ac" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="50" y="332" width="320" height="108" rx="15" fill="#edf3fc" stroke="#3267ac" stroke-width="2"/><text x="210.0" y="382.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#3267ac">Application B</text><text x="210.0" y="410.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">poll CQ → check status → wr_id</text>
<text x="425" y="360" font-size="17" font-weight="400" text-anchor="middle" class="" style="fill:#3267ac">5. poll</text>
<polyline points="210,440 210,492 1080,492 1080,440" fill="none" stroke="#147d78" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="650" y="483" font-size="18" font-weight="400" text-anchor="middle" class="" style="fill:#147d78">6. Read the completed buffer; process, then repost receive work.</text>
<rect x="50" y="551" width="1180" height="251" rx="15" fill="#f6f2fb" stroke="#c7b5dd" stroke-width="2" stroke-dasharray="7 6"/>
<text x="77" y="588" font-size="22" font-weight="600" text-anchor="start" class="" style="fill:#18334c">Optional wakeup path</text>
<rect x="84" y="625" width="260" height="86" rx="15" fill="#fff4e6" stroke="#ad6221" stroke-width="2"/><text x="214.0" y="664.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#ad6221">CQ notification</text><text x="214.0" y="692.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">requires req_notify_cq()</text>
<rect x="484" y="625" width="300" height="86" rx="15" fill="#fff4e6" stroke="#ad6221" stroke-width="2"/><text x="634.0" y="664.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#ad6221">Completion channel</text><text x="634.0" y="692.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">event identifies a CQ</text>
<rect x="925" y="625" width="268" height="86" rx="15" fill="#edf3fc" stroke="#3267ac" stroke-width="2"/><text x="1059.0" y="664.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#3267ac">Application B</text><text x="1059.0" y="692.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">get event → poll CQ</text>
<polyline points="344,668 484,668" fill="none" stroke="#ad6221" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)" stroke-dasharray="7 6"/>
<polyline points="784,668 925,668" fill="none" stroke="#ad6221" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)" stroke-dasharray="7 6"/>
<text x="80" y="766" font-size="19" font-weight="400" text-anchor="start" class="" style="fill:#526b80">One event is not one CQE. Getting / acknowledging an event does not consume CQEs.</text>
<text x="50" y="852" font-size="20" font-weight="600" text-anchor="start" class="" style="fill:#147d78">Payload → MR buffer</text>
<text x="459" y="852" font-size="20" font-weight="600" text-anchor="start" class="" style="fill:#ad6221">Completion result → CQ</text>
<text x="880" y="852" font-size="20" font-weight="600" text-anchor="start" class="" style="fill:#3267ac">Wakeup → channel</text>
<text x="50" y="887" font-size="16" font-weight="400" text-anchor="start" class="" style="fill:#526b80">Steps 5–6 require a successful receive completion. Polling does not automatically repost the RQ entry.</text>
</svg>
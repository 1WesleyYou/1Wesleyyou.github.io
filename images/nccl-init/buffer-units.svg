<text x="640" y="530" font-size="23" font-weight="600" text-anchor="middle" class="mono" style="fill:#3267ac">slot = (base + progress) % NCCL_STEPS</text>
<text x="640" y="571" font-size="20" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">The same buffer slots are reused across many chunks and collective operations.</text>
<text x="640" y="650" font-size="19" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">A channel is a parallel communication lane. A step / slice / chunk is not a network packet.</text>

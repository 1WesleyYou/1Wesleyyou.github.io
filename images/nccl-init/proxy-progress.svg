<rect x="640" y="175" width="56" height="76" rx="0" fill="#ffe6c4" stroke="#ad6221" stroke-width="2"/>
<rect x="696" y="175" width="56" height="76" rx="0" fill="#ffe6c4" stroke="#ad6221" stroke-width="2"/>
<rect x="752" y="175" width="56" height="76" rx="0" fill="#edf0f4" stroke="#cbd7e1" stroke-width="2"/>
<rect x="808" y="175" width="56" height="76" rx="0" fill="#edf0f4" stroke="#cbd7e1" stroke-width="2"/>
<rect x="864" y="175" width="56" height="76" rx="0" fill="#edf0f4" stroke="#cbd7e1" stroke-width="2"/>
<rect x="920" y="175" width="56" height="76" rx="0" fill="#edf0f4" stroke="#cbd7e1" stroke-width="2"/>
<rect x="976" y="175" width="56" height="76" rx="0" fill="#edf0f4" stroke="#cbd7e1" stroke-width="2"/>
<rect x="1032" y="175" width="56" height="76" rx="0" fill="#edf0f4" stroke="#cbd7e1" stroke-width="2"/>
<rect x="1088" y="175" width="56" height="76" rx="0" fill="#edf0f4" stroke="#cbd7e1" stroke-width="2"/>
<rect x="1144" y="175" width="56" height="76" rx="0" fill="#edf0f4" stroke="#cbd7e1" stroke-width="2"/>
<polyline points="304,294 304,253" fill="none" stroke="#3267ac" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="304" y="322" font-size="20" font-weight="600" text-anchor="middle" class="" style="fill:#3267ac">done = 4</text>
<polyline points="528,294 528,253" fill="none" stroke="#147d78" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
<text x="528" y="322" font-size="20" font-weight="600" text-anchor="middle" class="" style="fill:#147d78">transmitted = 8</text>
<polyline points="752,294 752,253" fill="none" stroke="#ad6221" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="752" y="322" font-size="20" font-weight="600" text-anchor="middle" class="" style="fill:#ad6221">posted = 12</text>
<rect x="82" y="186" width="220" height="53" rx="0" fill="#dce9fa" stroke="#dce9fa" stroke-width="2"/>
<rect x="306" y="186" width="220" height="53" rx="0" fill="#d6eee7" stroke="#d6eee7" stroke-width="2"/>
<rect x="530" y="186" width="220" height="53" rx="0" fill="#ffe6c4" stroke="#ffe6c4" stroke-width="2"/>
<rect x="754" y="186" width="444" height="53" rx="0" fill="#edf0f4" stroke="#edf0f4" stroke-width="2"/>
<text x="192" y="214" font-size="17" font-weight="600" text-anchor="middle" class="" style="fill:#3267ac">complete</text>
<text x="416" y="214" font-size="17" font-weight="600" text-anchor="middle" class="" style="fill:#147d78">in flight</text>
<text x="640" y="214" font-size="17" font-weight="600" text-anchor="middle" class="" style="fill:#ad6221">GPU window</text>
<text x="976" y="214" font-size="19" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">not opened</text>
<text x="640" y="379" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#18334c">[done, posted): 8 steps opened and not yet completed</text>
<rect x="60" y="442" width="300" height="104" rx="15" fill="#fff4e6" stroke="#ad6221" stroke-width="2"/><text x="210.0" y="490.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#ad6221">GPU produces data</text><text x="210.0" y="518.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">FIFO size + tail</text>
<rect x="490" y="442" width="300" height="104" rx="15" fill="#e9f6f1" stroke="#147d78" stroke-width="2"/><text x="640.0" y="490.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#147d78">Backend isend</text><text x="640.0" y="518.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">non-NULL request</text>
<rect x="920" y="442" width="300" height="104" rx="15" fill="#edf3fc" stroke="#3267ac" stroke-width="2"/><text x="1070.0" y="490.0" font-size="22" font-weight="600" text-anchor="middle" class="" style="fill:#3267ac">Backend test</text><text x="1070.0" y="518.0" font-size="16" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">CQE → request complete</text>
<polyline points="360,494 490,494" fill="none" stroke="#147d78" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#teal)"/>
<polyline points="790,494 920,494" fill="none" stroke="#3267ac" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="640" y="601" font-size="18" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">posted: window admission | transmitted: backend acceptance | done: backend completion</text>
<text x="640" y="660" font-size="21" font-weight="600" text-anchor="middle" class="" style="fill:#18334c">isend returning success with a NULL request does not advance transmitted.</text>
<text x="640" y="711" font-size="19" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">A local send completion does not mean the remote GPU has consumed the data.</text>
</svg>
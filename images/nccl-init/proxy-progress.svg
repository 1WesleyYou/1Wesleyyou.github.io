<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">Send proxy progress: done ≤ transmitted ≤ posted</title><desc id="desc">Example: nsteps = 20, done = 4, transmitted = 8, posted = 12. Units are steps, not SQ work entries.</desc>
<defs><marker id="ink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#18334c" stroke-width="1.6"/></marker><marker id="muted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#526b80" stroke-width="1.6"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#3267ac" stroke-width="1.6"/></marker><marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#147d78" stroke-width="1.6"/></marker><marker id="amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#ad6221" stroke-width="1.6"/></marker><marker id="line" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#cbd7e1" stroke-width="1.6"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<style>text {font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; fill:#18334c;} .mono {font-family: 'SFMono-Regular', Menlo, monospace;}</style>
<text x="46" y="56" font-size="30" font-weight="700" text-anchor="start" class="" style="fill:#18334c">Send proxy progress: done ≤ transmitted ≤ posted</text>
<text x="46" y="89" font-size="17" font-weight="400" text-anchor="start" class="" style="fill:#526b80">Example: nsteps = 20, done = 4, transmitted = 8, posted = 12. Units are steps, not SQ work entries.</text>
<text x="80" y="152" font-size="19" font-weight="400" text-anchor="start" class="" style="fill:#526b80">0</text>
<text x="1200" y="152" font-size="19" font-weight="400" text-anchor="middle" class="" style="fill:#526b80">20</text>
<rect x="80" y="175" width="56" height="76" rx="0" fill="#dce9fa" stroke="#3267ac" stroke-width="2"/>
<rect x="136" y="175" width="56" height="76" rx="0" fill="#dce9fa" stroke="#3267ac" stroke-width="2"/>
<rect x="192" y="175" width="56" height="76" rx="0" fill="#dce9fa" stroke="#3267ac" stroke-width="2"/>
<rect x="248" y="175" width="56" height="76" rx="0" fill="#dce9fa" stroke="#3267ac" stroke-width="2"/>
<rect x="304" y="175" width="56" height="76" rx="0" fill="#d6eee7" stroke="#147d78" stroke-width="2"/>
<rect x="360" y="175" width="56" height="76" rx="0" fill="#d6eee7" stroke="#147d78" stroke-width="2"/>
<rect x="416" y="175" width="56" height="76" rx="0" fill="#d6eee7" stroke="#147d78" stroke-width="2"/>
<rect x="472" y="175" width="56" height="76" rx="0" fill="#d6eee7" stroke="#147d78" stroke-width="2"/>
